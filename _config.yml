# Site settings
title: Vancouver Odia Cultural Association
email: vancouverodias@gmail.com
description: >-
  Vancouver Odia Cultural Association (VOCA) is a not-for-profit social and cultural organization 
  serving the Odia community in the Vancouver metro area.
baseurl: "/VOCA"
url: "https://vancouverodiaassociation.github.io"

# Build settings
theme: minima
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Internationalization
languages:
  - en
  - or
default_language: en

# Social media
social_links:
  facebook: "https://www.facebook.com/VancouverOdiaCulturalAssociation"
  facebook_group: "https://www.facebook.com/groups/423247997265467"
  instagram: "https://www.instagram.com/vancouverodias"

# Theme colors
theme_colors:
  primary: "#C1272D"   # Temple-flag crimson
  secondary: "#E8A13A" # Turmeric gold
  accent: "#D96C3F"    # Konark terracotta
  dark_bg: "#1A1613"
  dark_text: "#F3ECE2"
  light_bg: "#FAF6F0"
  light_text: "#1E1B18"

# Collections
collections:
  events:
    output: true
  galleries:
    output: true

# Defaults
defaults:
  - scope:
      path: ""
      type: "events"
    values:
      layout: "event"
  - scope:
      path: ""
      type: "galleries"
    values:
      layout: "gallery"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "default"
output: true

